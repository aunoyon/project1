<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17133a">
  <title>Contact | Hello, World!</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; color: #fff; background: #100e29; background-image: radial-gradient(ellipse at 15% 15%, #7928ca66, transparent 42%), radial-gradient(ellipse at 85% 80%, #0ea5e966, transparent 40%), linear-gradient(135deg,#100e29,#1c1745 55%,#111d42); }
    .glow { position: fixed; width: 22rem; aspect-ratio: 1; border-radius: 50%; filter: blur(80px); opacity: .35; pointer-events: none; animation: drift 10s ease-in-out infinite alternate; } .one { background: #ec4899; top: -9rem; right: 8%; } .two { background: #22d3ee; bottom: -12rem; left: 4%; animation-delay: -4s; }
    .site { width: min(90vw, 800px); position: relative; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    nav { display: flex; justify-content: center; gap: .5rem; margin: 0 0 1rem; } nav a { padding: .65rem 1rem; border-radius: 999px; color: #d3d0eb; text-decoration: none; font-size: .9rem; font-weight: 700; border: 1px solid transparent; transition: .2s ease; } nav a:hover, nav a[aria-current="page"] { color: #fff; background: #ffffff12; border-color: #ffffff24; } nav a:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    main { padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid #ffffff25; border-radius: 32px; background: #ffffff0c; box-shadow: 0 30px 100px #05041980, inset 0 1px #ffffff20; backdrop-filter: blur(18px); }
    .spark { display: inline-grid; place-items: center; width: 76px; height: 76px; margin-bottom: 1.5rem; border-radius: 24px; font-size: 2.1rem; background: linear-gradient(135deg,#fb7185,#fbbf24 50%,#a78bfa); box-shadow: 0 12px 36px #fb718544; transform: rotate(-7deg); }
    .eyebrow { margin: 0 0 .8rem; color: #b8b4dd; text-transform: uppercase; letter-spacing: .22em; font-size: .75rem; font-weight: 750; }
    h1 { margin: 0; font-size: clamp(3.3rem, 10vw, 6.8rem); line-height: .98; letter-spacing: -.075em; font-weight: 850; } h1 span { display: block; background: linear-gradient(100deg,#67e8f9 5%,#a78bfa 45%,#f9a8d4 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .details { max-width: 500px; margin: 1.6rem auto 1.2rem; color: #cbc9df; font-size: 1.05rem; line-height: 1.8; }
    .contact-card { max-width: 480px; margin: 1.2rem auto 1.8rem; padding: 1.2rem; border-radius: 20px; background: #ffffff0b; border: 1px solid #ffffff1c; color: #d7d4e9; line-height: 1.8; } .contact-card a { color: #67e8f9; font-weight: 700; text-decoration: none; } .contact-card a:hover { text-decoration: underline; }
    .note { margin: 2rem 0 0; color: #8e8aa9; font-size: .8rem; }
    .button { display: inline-flex; align-items: center; gap: .65rem; padding: .9rem 1.25rem; border: 1px solid #ffffff30; border-radius: 999px; color: #fff; font: inherit; font-weight: 700; text-decoration: none; background: linear-gradient(110deg,#7c3aed,#db2777); box-shadow: 0 8px 28px #a855f744; transition: transform .2s, box-shadow .2s; } .button:hover { transform: translateY(-3px); box-shadow: 0 14px 34px #a855f766; } .button:focus-visible { outline: 3px solid #67e8f9; outline-offset: 4px; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes drift { to { transform: translate(35px, 25px) scale(1.12); } }
    @media (max-width: 520px) { nav a { padding: .6rem .75rem; font-size: .82rem; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
  <div class="site">
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="bangladesh.html">Bangladesh</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <main>
      <div class="spark" aria-hidden="true">✉</div>
      <p class="eyebrow">Your next hello starts here</p>
      <h1>Let’s<span>connect</span></h1>
      <p class="details">Have a question, an idea, or just want to say hello? YOU'RE WELCOME! We’d love to hear from you.</p>
      <div class="contact-card">Drop us a note at<br><a href="mailto:hello@example.com">hello@example.com</a></div>
      <a class="button" href="about.html">More about us <span aria-hidden="true">→</span></a>
      <p class="note">Made with color, curiosity &amp; a little sparkle</p>
    </main>
  </div>
</body>
</html>
