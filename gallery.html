<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17133a">
  <title>Gallery | Hello, World!</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; padding: 2.5rem 0; display: grid; place-items: center; overflow-x: hidden; color: #fff; background: #100e29; background-image: radial-gradient(ellipse at 15% 15%, #7928ca66, transparent 42%), radial-gradient(ellipse at 85% 80%, #0ea5e966, transparent 40%), linear-gradient(135deg,#100e29,#1c1745 55%,#111d42); }
    .glow { position: fixed; width: 22rem; aspect-ratio: 1; border-radius: 50%; filter: blur(80px); opacity: .35; pointer-events: none; animation: drift 10s ease-in-out infinite alternate; } .one { background: #ec4899; top: -9rem; right: 8%; } .two { background: #22d3ee; bottom: -12rem; left: 4%; animation-delay: -4s; }
    .site { width: min(92vw, 980px); position: relative; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; } nav a { padding: .65rem 1rem; border-radius: 999px; color: #d3d0eb; text-decoration: none; font-size: .9rem; font-weight: 700; border: 1px solid transparent; transition: .2s ease; } nav a:hover, nav a[aria-current="page"] { color: #fff; background: #ffffff12; border-color: #ffffff24; } nav a:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    main { padding: clamp(1.5rem, 5vw, 3.5rem); text-align: center; border: 1px solid #ffffff25; border-radius: 32px; background: #ffffff0c; box-shadow: 0 30px 100px #05041980, inset 0 1px #ffffff20; backdrop-filter: blur(18px); }
    .eyebrow { margin: 0 0 .8rem; color: #b8b4dd; text-transform: uppercase; letter-spacing: .22em; font-size: .75rem; font-weight: 750; }
    h1 { margin: 0; font-size: clamp(3rem, 8vw, 5.5rem); line-height: .98; letter-spacing: -.075em; font-weight: 850; } h1 span { display: block; background: linear-gradient(100deg,#67e8f9 5%,#a78bfa 45%,#f9a8d4 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro { max-width: 640px; margin: 1.4rem auto 2rem; color: #cbc9df; font-size: 1.05rem; line-height: 1.8; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1rem; text-align: left; }
    figure { min-width: 0; margin: 0; overflow: hidden; border-radius: 20px; border: 1px solid #ffffff22; background: #ffffff0b; box-shadow: 0 14px 34px #05041950; transition: transform .25s ease, box-shadow .25s ease; }
    figure:hover { transform: translateY(-5px); box-shadow: 0 20px 42px #05041975; }
    figure img { display: block; width: 100%; height: 220px; object-fit: cover; background: #29244c; }
    figcaption { padding: 1rem 1.1rem 1.1rem; color: #bdb9d6; font-size: .9rem; line-height: 1.5; }
    figcaption strong { display: block; margin-bottom: .25rem; color: #fff; font-size: 1rem; }
    .note { margin: 1.8rem 0 0; color: #8e8aa9; font-size: .8rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes drift { to { transform: translate(35px, 25px) scale(1.12); } }
    @media (max-width: 700px) { .gallery { grid-template-columns: 1fr; } figure img { height: clamp(180px, 55vw, 300px); } } @media (max-width: 520px) { nav a { padding: .6rem .75rem; font-size: .82rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>

        <figure><img src="https://images.trvl-media.com/place/3000005755/85cd6815-93e8-4ead-85e5-47be6312fd9b.jpg" alt="Lush tea bushes covering the rolling hills near Sreemangal" loading="lazy"><figcaption><strong>Sreemangal tea gardens</strong>Neat green rows ripple over the hills of the Sylhet region.</figcaption></figure>

  </div>
